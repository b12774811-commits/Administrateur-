<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Ela Group Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1B1712; --paper:#F5F1E6; --raised:#EDE8DA; --amber:#EFA928; --teal:#1E8A78; --teal-deep:#146357; --red:#B3341F; --line:rgba(27,23,18,.16); --soft:rgba(27,23,18,.62); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif; }
  h1,h2,h3{ font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-.01em; }
  .wrap{ max-width:720px; margin:0 auto; padding:20px 18px 60px; }
  .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:24px; }
  .top h1{ font-size:1.15rem; }
  label{ display:block; font-weight:500; margin:16px 0 6px; font-size:.95rem; }
  input,textarea{ width:100%; padding:12px; font:inherit; color:inherit; background:#fff; border:1px solid var(--line); border-radius:3px; }
  textarea{ min-height:84px; resize:vertical; }
  input[type=file]{ padding:10px; background:var(--raised); }
  .btn{ display:inline-flex; justify-content:center; align-items:center; padding:12px 20px; font:500 .95rem 'IBM Plex Sans',sans-serif; border-radius:3px; border:1px solid transparent; cursor:pointer; }
  .btn-main{ background:var(--teal); color:#F5F1E6; } .btn-main:hover{ background:var(--teal-deep); }
  .btn-line{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-del{ background:transparent; border-color:var(--red); color:var(--red); }
  .btn[disabled]{ opacity:.55; cursor:wait; }
  :focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .card{ background:var(--raised); border:1px solid var(--line); border-radius:3px; padding:22px 18px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
  .msg{ margin-top:14px; font-size:.92rem; min-height:1.4em; }
  .msg.err{ color:var(--red); } .msg.ok{ color:var(--teal-deep); }
  #preview{ display:none; width:140px; height:140px; object-fit:cover; border-radius:3px; margin-top:10px; border:1px solid var(--line); }
  .list{ margin-top:36px; }
  .list h2{ font-size:1.2rem; margin-bottom:14px; }
  .item{ display:flex; gap:14px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
  .item img,.item .ph{ width:64px; height:64px; flex:none; object-fit:cover; border-radius:3px; background:var(--raised); }
  .item .ph{ display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--soft); text-align:center; }
  .item .info{ flex:1; min-width:0; }
  .item .info strong{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .info span{ color:var(--soft); font-size:.9rem; }
  .item .acts{ display:flex; flex-direction:column; gap:6px; }
  .item .btn{ padding:7px 12px; font-size:.85rem; }
  .empty{ color:var(--soft); padding:12px 0; border-top:1px solid var(--line); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login-view" hidden>
    <div class="top"><h1>Administration</h1></div>
    <div class="card">
      <h2>Connexion</h2>
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="username">
      <label for="pass">Mot de passe</label>
      <input id="pass" type="password" autocomplete="current-password">
      <div class="row"><button class="btn btn-main" id="login-btn">Se connecter</button></div>
      <div class="msg" id="login-msg" role="alert"></div>
    </div>
  </section>

  <section id="admin-view" hidden>
    <div class="top">
      <h1>Boutique — Ela Group Service</h1>
      <button class="btn btn-line" id="logout-btn">Se déconnecter</button>
    </div>

    <div class="card">
      <h2 id="form-title">Ajouter un article</h2>
      <label for="f-name">Nom de l’article</label>
      <input id="f-name" maxlength="80">
      <label for="f-price">Prix en FCFA</label>
      <input id="f-price" type="number" inputmode="numeric" min="0" step="1">
      <label for="f-desc">Description courte</label>
      <textarea id="f-desc" maxlength="300"></textarea>
      <label for="f-photo">Photo</label>
      <input id="f-photo" type="file" accept="image/*">
      <img id="preview" alt="Aperçu de la photo">
      <div class="row">
        <button class="btn btn-main" id="save-btn">Enregistrer l’article</button>
        <button class="btn btn-line" id="cancel-btn" hidden>Annuler la modification</button>
      </div>
      <div class="msg" id="form-msg" role="status"></div>
    </div>

    <div class="list">
      <h2>Articles en ligne</h2>
      <div id="items"></div>
    </div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDz8eWj67YWFq5mPu5X_e2q9n6YHq0XF-k",
  authDomain: "elagroupservices-7d3b6.firebaseapp.com",
  projectId: "elagroupservices-7d3b6",
  storageBucket: "elagroupservices-7d3b6.firebasestorage.app",
  messagingSenderId: "402394593738",
  appId: "1:402394593738:web:10282d65f1c5fb04463733"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const say = (id, text, kind) => { const e = $(id); e.textContent = text; e.className = "msg " + (kind || ""); };

let editingId = null, newImg = null, currentImg = "", products = [];

/* ---------- Connexion ---------- */
onAuthStateChanged(auth, user => {
  $("login-view").hidden = !!user;
  $("admin-view").hidden = !user;
  if (user) loadItems();
});
$("login-btn").onclick = async () => {
  const b = $("login-btn"); b.disabled = true; say("login-msg", "");
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { say("login-msg", "E-mail ou mot de passe incorrect.", "err"); }
  b.disabled = false;
};
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("login-btn").click(); });
$("logout-btn").onclick = () => signOut(auth);

/* ---------- Photo : réduite avant l’envoi ---------- */
function shrink(file, max = 800, quality = 0.75) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => ko(new Error("Image illisible"));
    img.src = url;
  });
}
$("f-photo").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { newImg = await shrink(f); $("preview").src = newImg; $("preview").style.display = "block"; say("form-msg", ""); }
  catch (err) { newImg = null; say("form-msg", "Cette photo ne peut pas être lue. Choisissez-en une autre.", "err"); }
};

/* ---------- Formulaire ---------- */
function resetForm() {
  editingId = null; newImg = null; currentImg = "";
  ["f-name", "f-price", "f-desc"].forEach(i => $(i).value = "");
  $("f-photo").value = ""; $("preview").style.display = "none";
  $("form-title").textContent = "Ajouter un article";
  $("cancel-btn").hidden = true;
}
$("cancel-btn").onclick = () => { resetForm(); say("form-msg", ""); };

$("save-btn").onclick = async () => {
  const name = $("f-name").value.trim(), price = Number($("f-price").value);
  if (!name) return say("form-msg", "Écrivez le nom de l’article.", "err");
  if (!(price >= 0) || $("f-price").value === "") return say("form-msg", "Indiquez le prix en FCFA.", "err");
  const b = $("save-btn"); b.disabled = true; say("form-msg", "Enregistrement…");
  const data = { name, price, desc: $("f-desc").value.trim(), img: newImg || currentImg || "" };
  try {
    if (editingId) await updateDoc(doc(db, "products", editingId), data);
    else await addDoc(collection(db, "products"), { ...data, createdAt: serverTimestamp() });
    const wasEdit = !!editingId;
    resetForm(); await loadItems();
    say("form-msg", wasEdit ? "Article modifié." : "Article ajouté. Il est visible sur le site.", "ok");
  } catch (e) {
    say("form-msg", "L’enregistrement a échoué : " + (e.code || "") + " — " + (e.message || e) + " [connecté : " + (auth.currentUser ? auth.currentUser.email : "personne") + "]", "err");
  }
  b.disabled = false;
};

/* ---------- Liste ---------- */
async function loadItems() {
  const box = $("items"); box.textContent = "Chargement…";
  try {
    const snap = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc")));
    products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { box.textContent = "Impossible de charger les articles. Vérifiez les règles Firestore."; return; }
  box.textContent = "";
  if (!products.length) { const p = document.createElement("div"); p.className = "empty"; p.textContent = "Aucun article pour l’instant. Ajoutez le premier avec le formulaire ci-dessus."; box.appendChild(p); return; }
  products.forEach(p => {
    const row = document.createElement("div"); row.className = "item";
    let m;
    if (p.img) { m = document.createElement("img"); m.src = p.img; m.alt = p.name; }
    else { m = document.createElement("div"); m.className = "ph"; m.textContent = "Sans photo"; }
    const info = document.createElement("div"); info.className = "info";
    const s = document.createElement("strong"); s.textContent = p.name;
    const sp = document.createElement("span"); sp.textContent = Number(p.price).toLocaleString("fr-FR") + " FCFA";
    info.append(s, sp);
    const acts = document.createElement("div"); acts.className = "acts";
    const be = document.createElement("button"); be.className = "btn btn-line"; be.textContent = "Modifier";
    be.onclick = () => {
      editingId = p.id; newImg = null; currentImg = p.img || "";
      $("f-name").value = p.name; $("f-price").value = p.price; $("f-desc").value = p.desc || "";
      $("f-photo").value = "";
      if (currentImg) { $("preview").src = currentImg; $("preview").style.display = "block"; } else $("preview").style.display = "none";
      $("form-title").textContent = "Modifier l’article"; $("cancel-btn").hidden = false;
      say("form-msg", "Changez ce que vous voulez, puis appuyez sur « Enregistrer l’article ».");
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    const bd = document.createElement("button"); bd.className = "btn btn-del"; bd.textContent = "Supprimer";
    bd.onclick = async () => {
      if (!confirm("Supprimer « " + p.name + " » du site ?")) return;
      try { await deleteDoc(doc(db, "products", p.id)); if (editingId === p.id) resetForm(); await loadItems(); say("form-msg", "Article supprimé.", "ok"); }
      catch (e) { say("form-msg", "La suppression a échoué.", "err"); }
    };
    acts.append(be, bd);
    row.append(m, info, acts); box.appendChild(row);
  });
}
</script>
</body>
</html>
